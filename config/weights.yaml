# M3 — 격차 점수(Gap Score) 가중치 (README §4, §7)
#
# 0.5/0.5는 비교용 중립 기본값이다. GM 담당자의 실제 검토·확정 기록은
# reports/collaboration_evidence.md에 아직 첨부되지 않았다. 상위 4개 동
# (구룡포읍·호미곶면·장기면·대송면)은 demand_weight가
# 0.4 이상이면 임계거리 1/3/5km 어디서든 5위 안에 남는다(0.3 이하에서는 밀려남).
# 검증: reports/m6_validation.md
# 관련 리포트: reports/m3_gap_score.md

gap_score:
  # demand_weight + access_weight = 1.0 (score.py의 build_weights()가 검증)
  demand_weight: 0.5   # 수요(외국인 인구 비율) 성분 가중치 — 검토 전 중립 기본값
  access_weight: 0.5   # 접근성 결핍 성분 가중치 — 검토 전 중립 기본값

  # 수요 신호로 pop_foreign(외국인 인구 절대값)이 아니라 pop_foreign/pop_total
  # (외국인 비율)을 쓴다 — 절대값은 인구 규모가 큰 행정동(오천읍 등)이
  # 자동으로 수요 상위가 되어, "이 동네에서 외국인 주민이 상대적으로 얼마나
  # 큰 비중인가"라는 격차 진단의 원래 질문과 어긋난다.
  demand_metric: pop_foreign_ratio

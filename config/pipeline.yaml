# 포항 외국인 주민 생활 인프라 격차 진단 파이프라인 설정
# 파라미터 외부화 원칙(README §1) — 대상 행정동, 인프라 종류, 임계 거리는
# 코드에 하드코딩하지 않고 전부 여기서 관리한다.

target_crs: EPSG:5179

# 2SFCA 임계 거리 민감도 분석용 (README §7) — 단일 값 대신 여러 값을 돌려
# 행정동 순위가 뒤집히는지 확인한다.
distance_thresholds_km: [1, 3, 5]

access:
  # accessibility.parquet(단일 대표값) 산출에 쓰는 기본 임계값. distance_thresholds_km
  # 세 값의 중앙값 — 특정 근거로 고른 "정답"이 아니라 절충값이며, 실제 결론은
  # 민감도 분석표(distance_thresholds_km 전체)를 함께 봐야 한다(README §7).
  default_threshold_km: 3
  # 2SFCA를 돌릴 공급 도메인. category_large는 facilities.parquet의 컬럼값과
  # 일치해야 한다(src/preprocess/admin_join.py 참고).
  #
  # "금융"은 원래 목표(README §1)였지만 상가정보 API에 데이터가 없고
  # (reports/m2_commercial.md) 대체 공개 데이터도 못 찾아, "의료" 단일 지수로
  # M2를 진행하기로 결정했다(2026-08-26, 같은 리포트 "결정" 절 참고). 향후
  # 금융 데이터를 확보하면 여기에 도메인을 추가하는 것만으로 계산된다 —
  # build_accessibility는 공급 0건 도메인을 에러 없이 건너뛴다(README §7
  # "데이터 확보 실패가 시스템 전체를 멈추지 않게 한다").
  domains:
    - category_large: 보건의료
      fac_type_label: 의료

infra_types:
  - id: medical
    label: 의료기관
    source: 심평원 병원정보서비스 + 약국정보서비스 (data.go.kr)
  - id: commercial
    label: 상가(상권)정보
    source: 소상공인시장진흥공단 (data.go.kr)

kosis:
  org_id: "216"
  tbl_id: DT_216N_B000J2
  itm_id: "16216T074713+16216TB000J201+16216TB000J202"
  obj_l2: "15216TB000J20101" # 성별 분류코드 — 계(총계), 이 통계표 전용 코드
  start_prd: "2020"
  end_prd: "2025"

sgis:
  year: "2025" # hadmarea.geojson 기준연도. KOSIS 인구 데이터(end_prd)와 연도 맞춤.
  sigungu_codes: # 통계청 행정구역코드(5자리), low_search=1로 하위 읍면동 29개 전부 조회
    - "37011" # 포항시 남구
    - "37012" # 포항시 북구

commercial:
  # 소상공인시장진흥공단 상가정보 API(storeListInRadius)는 행정동 코드로 직접
  # 조회할 수 없다 — 행안부 법정동코드 체계(경북=47)를 쓰는데 이 프로젝트는
  # SGIS/KOSIS 통계청 코드(경북=37)를 기준으로 삼아(README §5) 값 자체가
  # 안 맞는다(reports/m2_commercial.md). 그래서 행정동 중심 좌표 반경검색으로
  # 우회하고, 소속 배정은 preprocess 단계 point-in-polygon으로 처리한다.
  max_radius_m: 10000 # API 실측 상한 — 11000m부터 INVALID_REQUEST_PARAMETER_ERROR
  radius_margin: 1.15 # 행정동 중심→최원거리 정점 실측값에 곱하는 여유
  num_of_rows_per_page: 1000 # API 페이지당 최대 행 수(실측)

